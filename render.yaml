services:
  - type: web
    name: mavmole
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: GOOGLE_MAPS_API_KEY
        sync: false
